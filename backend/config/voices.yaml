# TTS API
api:
  endpoint: "https://voicer.mat3u.com/api/v1/voice/synthesize"
  status_endpoint: "https://voicer.mat3u.com/api/v1/voice/status/{task_id}"
  download_endpoint: "https://voicer.mat3u.com/api/v1/voice/download/{task_id}"
  poll_interval: 2
  max_polls: 240
  auth_header: "Authorization"
  auth_prefix: "Bearer"
