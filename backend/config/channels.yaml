# Channel profiles — each channel has its own niche, voice, style, history
# Voice is set once and never changes for the channel

channels:
  de:
    name: "Nina"
    niche: "curiosity_history"
    youtube_channel_id: "UCVZZnW0SO_AAWqQCfTbgRPg"  # немецкий curiosity-канал Nina
    niche_keywords:
      - "neugierige Geschichte"
      - "menschliche Psychologie"
      - "menschliche Natur"
      - "frühe Menschen"
      - "Zivilisation"
      - "neugierige Wissenschaft"
    voice_id: "Fghah4fztZORbiKfIGAs"  # ElevenLabs — выбран клиентом
    style: "documentary"
    visual_mode: "stick_figure"
    music_mood: "calm"
    duration_minutes: 20
    description: "Nina — ich erkläre die neugierigen Fragen über die frühen Menschen, den Verstand und die menschliche Natur, damit du dein eigenes Leben aus einer anderen Perspektive siehst."
    history_window: 15
    script_style:
      tone: "calm, warm, reflective first-person essayist — a smart friend sharing a discovery"
      structure: "present-moment mirror hook → debunk assumption → 3 evidence beats (one real verifiable fact each, never fabricated) → big idea → loop back to now"
      narration: "first person 'ich' + second person 'du'/'wir' — pull the listener into their own life"
      forbidden_phrases:
        - "Hallo Leute"
        - "Willkommen zurück"
        - "Vergiss nicht zu abonnieren"
        - "In diesem Video"
        - "Du wirst es nicht glauben"
    search_queries:
      - "wie lebten die frühen Menschen"
      - "Geschichte der Menschheit Dokumentation"
      - "Psychologie des menschlichen Verhaltens"
      - "menschliche Natur Wissenschaft"
      - "antike Zivilisationen Entdeckungen"
      - "warum entwickelten sich Menschen"
      - "Kuriositäten der alten Geschichte"
      - "was machten prähistorische Menschen"

